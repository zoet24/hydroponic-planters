# Optional. The default dev broker is embedded (pnpm dev:broker) so nothing needs
# installing. Use Mosquitto when you want mosquitto_sub to debug real hardware:
#
#   brew install mosquitto
#   mosquitto -c infra/mosquitto.conf
#   mosquitto_sub -h localhost -v -t 'planter-001/#'
#
# Mosquitto 2.x binds localhost only and denies anonymous clients by default,
# which would stop the ESP32 connecting over the hotspot. Both lines below are
# required, and macOS will prompt to allow incoming connections the first time.

listener 1883 0.0.0.0
allow_anonymous true
persistence false
